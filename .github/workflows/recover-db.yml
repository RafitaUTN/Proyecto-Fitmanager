name: Recover Supabase DB
on: workflow_dispatch

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reset DB password and set new DATABASE_URL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_PASS="FitManager2026!"
          echo "Resetting DB password with PUT..."
          curl -s -X PUT "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/password" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"password\":\"$NEW_PASS\"}" -w "\nHTTP_CODE:%{http_code}\n"

          echo "---"

          echo "Trying POST /v1/projects/.../db/password..."
          curl -s -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/db/password" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"password\":\"$NEW_PASS\"}" -w "\nHTTP_CODE:%{http_code}\n"

          echo "---DONE TESTS---"
