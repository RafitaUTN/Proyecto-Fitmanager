services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:3000"
    volumes: []
    environment:
      NODE_ENV: production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "80:80"
    volumes: []
    depends_on:
      backend:
        condition: service_healthy

  pgadmin:
    profiles:
      - donotstart
