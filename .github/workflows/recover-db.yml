name: Recover Supabase DB
on: workflow_dispatch

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reset DB password
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          NEW_PASS="FitManager2026!"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/password" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"password\":\"$NEW_PASS\"}")
          echo "PATCH HTTP code: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then exit 1; fi

          DATABASE_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${NEW_PASS}@aws-0-us-east-1.pooler.supabase.com:6543/postgres?pgbouncer=true"
          echo "DATABASE_URL written to artifact (password: $NEW_PASS)"
          echo "$DATABASE_URL" > /tmp/database_url.txt

      - uses: actions/upload-artifact@v4
        with:
          name: database-url
          path: /tmp/database_url.txt

      - name: Migrate schema + seed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          cd backend
          npm ci
          npx tsx scripts/migrate-via-api.ts
