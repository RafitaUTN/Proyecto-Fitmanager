services:
  postgres:
    image: postgres:17-alpine
    container_name: fitmanager-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitmanager_secret}
      POSTGRES_DB: ${POSTGRES_DB:-fitmanager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitmanager -d fitmanager"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fitmanager-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fitmanager.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: fitmanager-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fitmanager}:${POSTGRES_PASSWORD:-fitmanager_secret}@postgres:5432/${POSTGRES_DB:-fitmanager}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3000
      ACTIVE_EMAIL_PROVIDER: ${ACTIVE_EMAIL_PROVIDER}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      APP_ENV: ${APP_ENV}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      EMAIL_DEV_OVERRIDE: ${EMAIL_DEV_OVERRIDE}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: sh -c "npx prisma migrate deploy && if [ \"$${SEED_ON_STARTUP:-false}\" = \"true\" ]; then npm run prisma:seed; fi && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: fitmanager-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000/api
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backup:
    image: postgres:17-alpine
    container_name: fitmanager-backup
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitmanager_secret}
      POSTGRES_DB: ${POSTGRES_DB:-fitmanager}
      BACKUP_HOST: postgres
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
    volumes:
      - postgres_backups:/backups
      - ./backup:/backup:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "sh /backup/entrypoint.sh"

volumes:
  postgres_data:
  postgres_backups:
