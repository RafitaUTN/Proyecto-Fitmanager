name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health check (backend real, SELECT 1)
        run: |
          RESPONSE=$(curl -fsS -m 30 https://fitmanager-backend-nine.vercel.app/api/health)
          echo "Respuesta: $RESPONSE"
          echo "$RESPONSE" | grep -q '"db":"connected"' || { echo "ERROR: BD no conectada"; exit 1; }
