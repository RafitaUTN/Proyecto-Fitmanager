name: Deploy a Vercel

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy-backend:
    name: Backend / production deploy after green CI
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm install --global vercel@58.9.0
      - name: Link production project
        run: vercel link --yes --project fitmanager-backend --scope progra2 --token '${{ secrets.VERCEL_TOKEN }}'
      - name: Synchronize Supabase connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          vercel env update DATABASE_URL production --value "$SUPABASE_DB_URL" --yes --token '${{ secrets.VERCEL_TOKEN }}' \
            || echo "$SUPABASE_DB_URL" | vercel env add DATABASE_URL production --yes --token '${{ secrets.VERCEL_TOKEN }}'
      - name: Synchronize public app URL for transactional emails
        run: |
          vercel env update PUBLIC_APP_URL production --value 'https://fitmanager-saas.vercel.app' --yes --token '${{ secrets.VERCEL_TOKEN }}' \
            || echo 'https://fitmanager-saas.vercel.app' | vercel env add PUBLIC_APP_URL production --yes --token '${{ secrets.VERCEL_TOKEN }}'
      - name: Synchronize frontend origins for CORS
        run: |
          vercel env update FRONTEND_URLS production --value 'https://fitmanager-saas.vercel.app,https://frontend-progra2.vercel.app,https://frontend-git-main-progra2.vercel.app' --yes --token '${{ secrets.VERCEL_TOKEN }}' \
            || echo 'https://fitmanager-saas.vercel.app,https://frontend-progra2.vercel.app,https://frontend-git-main-progra2.vercel.app' | vercel env add FRONTEND_URLS production --yes --token '${{ secrets.VERCEL_TOKEN }}'
      - name: Synchronize Resend email provider
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          vercel env update ACTIVE_EMAIL_PROVIDER production --value resend --yes --token '${{ secrets.VERCEL_TOKEN }}' \
            || echo 'resend' | vercel env add ACTIVE_EMAIL_PROVIDER production --yes --token '${{ secrets.VERCEL_TOKEN }}'
          vercel env update RESEND_API_KEY production --value "$RESEND_API_KEY" --yes --token '${{ secrets.VERCEL_TOKEN }}' \
            || echo "$RESEND_API_KEY" | vercel env add RESEND_API_KEY production --yes --token '${{ secrets.VERCEL_TOKEN }}'
          vercel env update EMAIL_FROM production --value 'FitManager <onboarding@resend.dev>' --yes --token '${{ secrets.VERCEL_TOKEN }}' \
            || echo 'FitManager <onboarding@resend.dev>' | vercel env add EMAIL_FROM production --yes --token '${{ secrets.VERCEL_TOKEN }}'
      - name: Deploy production
        run: vercel deploy --prod --yes --token '${{ secrets.VERCEL_TOKEN }}'
      - name: Post-deploy smoke
        run: curl --fail --show-error --silent --retry 5 --retry-delay 5 https://fitmanager-backend-nine.vercel.app/api/health
