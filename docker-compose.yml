services:
  postgres:
    image: postgres:17-alpine
    container_name: fitmanager-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitmanager_secret}
      POSTGRES_DB: ${POSTGRES_DB:-fitmanager}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fitmanager-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fitmanager.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitmanager-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fitmanager}:${POSTGRES_PASSWORD:-fitmanager_secret}@postgres:5432/${POSTGRES_DB:-fitmanager}
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_refresh_secret}
      PORT: 3000
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    depends_on:
      - postgres
    command: sh -c "npx prisma db push && (npx prisma db seed 2>/dev/null || echo 'Seed ya ejecutado') && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fitmanager-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000/api
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  postgres_data:
