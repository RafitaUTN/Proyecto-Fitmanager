name: Recover Supabase DB
on: workflow_dispatch

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reset DB password and set new DATABASE_URL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          NEW_PASS="FitManager2026!"
          echo "Resetting DB password..."
          curl -sf -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/password" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"password\":\"$NEW_PASS\"}"
          echo "Password reset OK"

          DATABASE_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${NEW_PASS}@aws-0-us-east-1.pooler.supabase.com:6543/postgres?pgbouncer=true"
          echo "Setting GH secret DATABASE_URL..."
          echo "$DATABASE_URL" | gh secret set DATABASE_URL --repo ${{ github.repository }}

      - name: Migrate schema + seed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          cd backend
          npm ci
          npx tsx scripts/migrate-via-api.ts
