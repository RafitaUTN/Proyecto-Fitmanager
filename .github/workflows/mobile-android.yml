name: Mobile Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

jobs:
  build-android-apk:
    name: Build APK Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://fitmanager-backend-nine.vercel.app/api' }}
      VITE_ALLOW_ANDROID_EMULATOR_API: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install mobile dependencies
        run: npm ci

      - name: Validate API URL
        shell: bash
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "VITE_API_URL debe configurarse como variable del repo."
            exit 1
          fi

      - name: Build frontend
        run: npm run build:web

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: mobile/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitmanager-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
